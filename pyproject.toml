[project]
name = "venue-agent"
version = "15.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn>=0.42.0",
    "redis>=7.4.0",
    "psutil>=7.2.2",
    "tailer>=0.4.1",
    "PyJWT[crypto]>=2.12.1",
    "pydantic>=2.12.5",
    "pyaml-env>=1.2.2",
    "PyYAML>=6.0.3",
    "starlette>=1.0.0",
    "click>=8.3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "requests>=2.33.1",
    "httpx>=0.28.1",
]
